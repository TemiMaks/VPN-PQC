name: Sync to Azure VM on Push

on:
  push:
    branches:
      - develope

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Konfiguracja klucza SSH i pull zmian
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/azureuser/vpn-project
            git fetch origin develope
            git reset --hard origin/develope